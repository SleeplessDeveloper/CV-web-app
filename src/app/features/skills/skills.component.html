<section class="skills-section">
    <div class="section-container">
      <h2 class="section-title">Technical Skills</h2>
      <div class="skills-grid">
        <div class="skill-category" *ngFor="let category of cvData?.skills">
          <h3>{{ category.name }}</h3>
          <div class="skill-tags">
            <span class="skill-tag" *ngFor="let skill of category.items">{{ skill }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>
